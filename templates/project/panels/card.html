<!doctype html>
<!-- A title or end card. Text comes from the URL: card.html?title=…&sub=…&foot=…
     (in a scene: await h.goto(h.fileUrl('panels/card.html', { title: 'My tool', sub: '…' }))).
     With &hold=1 the text waits for window.play(), so a scene can load it off camera and start the
     animation inside a segment. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Card</title>
<style>
  :root { --bg: #fbfaf7; --ink: #1d1a16; --muted: #6b645a; --accent: #c96412; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
  main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; text-align: center; padding: 0 12vw; box-sizing: border-box; }
  h1 { font-size: 96px; font-weight: 650; letter-spacing: -0.02em; margin: 0; }
  p { font-size: 38px; color: var(--muted); margin: 0; max-width: 1300px; line-height: 1.35; }
  footer { position: absolute; bottom: 72px; left: 0; right: 0; text-align: center; font: 500 30px ui-monospace, "Cascadia Mono", Consolas, monospace; color: var(--accent); }
  h1, p, footer { opacity: 0; transform: translateY(12px); }
  .go h1 { animation: up .7s .15s ease-out forwards; }
  .go p { animation: up .7s .45s ease-out forwards; }
  .go footer { animation: up .7s .8s ease-out forwards; }
  @keyframes up { to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<main><h1 id="title"></h1><p id="sub"></p></main>
<footer id="foot"></footer>
<script>
  const q = new URLSearchParams(location.search);
  for (const id of ['title', 'sub', 'foot']) {
    const el = document.getElementById(id);
    if (q.get(id)) el.textContent = q.get(id); else el.remove();
  }
  window.play = () => document.body.classList.add('go');
  if (!q.has('hold')) window.play();
</script>
</body>
</html>
