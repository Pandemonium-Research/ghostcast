<!doctype html>
<!-- flagpole's title card. The animation waits for window.play(), which ghostcast calls when the
     beat starts, so the card is loaded off camera and comes in on camera. -->
<html lang="en">
<meta charset="utf-8">
<title>flagpole</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { display: grid; place-items: center; overflow: hidden; color: #fff; font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: radial-gradient(900px 500px at 50% 42%, rgba(16, 185, 129, .22), transparent 70%), linear-gradient(160deg, #0b1220, #0f172a 60%, #0b1220); }
  main { display: flex; flex-direction: column; align-items: center; gap: 30px; }
  .lockup { display: flex; align-items: center; gap: 30px; }
  .logo { width: 116px; height: 116px; border-radius: 30px; background: #10b981; display: grid; place-items: center; box-shadow: 0 24px 60px rgba(16, 185, 129, .35); }
  h1 { margin: 0; font-size: 132px; font-weight: 700; letter-spacing: -0.04em; }
  p { margin: 0; font-size: 40px; color: #a7f3d0; letter-spacing: -0.01em; }
  .logo, h1, p { opacity: 0; }
  .go .logo { animation: pop .7s cubic-bezier(.2, .9, .3, 1.3) forwards; }
  .go h1 { animation: rise .7s .2s ease-out forwards; }
  .go p { animation: rise .7s .55s ease-out forwards; }
  @keyframes pop { from { opacity: 0; transform: scale(.6) rotate(-8deg); } to { opacity: 1; transform: none; } }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
</style>
<main>
  <div class="lockup">
    <div class="logo"><svg width="64" height="64" viewBox="0 0 18 18" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16V2"/><path d="M4 3h9l-2 3.5L13 10H4"/></svg></div>
    <h1>flagpole</h1>
  </div>
  <p>Feature flags from your terminal.</p>
</main>
<script>
  window.play = () => document.body.classList.add('go');
  if (!/[?&]hold=1/.test(location.search)) window.play();
</script>
</html>
