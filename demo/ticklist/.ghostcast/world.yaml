source: ..          # demo/ticklist, the folder around .ghostcast/
mode: snapshot
setup:              # run once in each copy; every take starts from the seed tasks
  - cp tasks.seed.json tasks.json
services:
  - name: web
    cmd: node server.js
    port: true
    ready:
      url: http://127.0.0.1:${PORT}/
      timeout: 30000
