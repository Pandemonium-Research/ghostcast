# The whole suite on each OS: unit tests, then real headless shoots through Chrome, bash and ffmpeg.
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # Keep what a failed test leaves behind in one place for the upload below. The runner context
      # only exists inside steps, so these are set here rather than in the job's env.
      - name: temporary folders
        shell: bash
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "GHOSTCAST_CACHE=$RUNNER_TEMP/ghostcast-cache" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: git identity for test fixtures
        run: |
          git config --global user.name "ghostcast ci"
          git config --global user.email "ci@example.invalid"
      - run: npm ci
      - run: node bin/ghostcast.mjs doctor
      - run: npm test
      # The stage 3 promise, timed on each OS: from the packed package to a first clip.
      - name: first clip from a clean install
        shell: bash
        run: |
          start=$(date +%s)
          npm pack --silent --pack-destination "$RUNNER_TEMP" > /dev/null
          mkdir -p "$RUNNER_TEMP/clean/app"
          cd "$RUNNER_TEMP/clean"
          npm init -y > /dev/null
          npm install --silent "$RUNNER_TEMP"/ghostcast-*.tgz
          installed=$(date +%s)
          cd app
          git init -q && echo "# app" > README.md && git add . && git commit -qm init
          ../node_modules/.bin/ghostcast shoot "ls -la"
          done=$(date +%s)
          test -s ls-la.mp4 && test -s ls-la.gif
          echo "${{ runner.os }}: install $((installed - start)) s, shoot $((done - installed)) s, first clip $((done - start)) s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: keep what failed tests left
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/ghostcast-*/**/*.png
            ${{ runner.temp }}/ghostcast-*/**/*.json
            ${{ runner.temp }}/ghostcast-*/**/*.log
            ${{ runner.temp }}/ghostcast-*/**/*.md
          if-no-files-found: ignore
          retention-days: 7
